name: Build e publicação

# Push na main: testa, exporta Web + Windows e publica a versão Web no
# GitHub Pages. Tag v* (ex.: v1.0.0): também cria uma Release com o .exe.
#
# Endurecimento (pentest): permissões mínimas por job, actions fixadas por
# SHA de commit (tag pode ser movida), Godot verificado por SHA-512 e
# timeouts (erro de script no Godot headless trava em vez de sair).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable
  # SHA512-SUMS.txt oficial da release 4.7.2-stable
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # histórico e tags pro git describe (versão mostrada nas Opções)
          fetch-depth: 0

      - name: Cache do Godot e templates
        id: cache-godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_SHA512 }}

      - name: Baixar e verificar Godot e templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache
          cd ~/godot-cache
          curl -fsSL -o godot.zip "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c -
          unzip -q godot.zip && rm godot.zip
          curl -fsSL -o templates.tpz "$GODOT_URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$TEMPLATES_SHA512  templates.tpz" | sha512sum -c -
          unzip -q templates.tpz && rm templates.tpz
          # só os templates usados aqui (o pacote completo tem 1,3 GB)
          find templates -type f ! -name 'web_nothreads_*' ! -name 'windows_*_x86_64*' ! -name 'version.txt' -delete

      - name: Instalar Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp ~/godot-cache/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          sudo ln -s ~/godot-cache/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Versão do jogo
        # tag + commits depois dela + hash (ex.: v1.0.1-3-gb71595d): aparece nas
        # Opções e diz exatamente qual código está publicado
        run: |
          VERSION=$(git describe --tags --always)
          sed -i "s|^config/version=.*|config/version=\"$VERSION\"|" project.godot
          grep -qF "config/version=\"$VERSION\"" project.godot
          echo "Versão: $VERSION"

      - name: Importar assets
        run: timeout 600 godot --headless --path . --import

      - name: Testes
        # erro de script no GDScript não é capturável pelo teste: falha também
        # se aparecer SCRIPT ERROR no log, mesmo com "0 falhas".
        run: |
          set -o pipefail
          timeout 600 godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log

      - name: Vetores de paridade do servidor em dia
        # o servidor do ranking refaz casos com a mesma lógica; se o núcleo
        # ou os dados mudarem, os vetores (server/test/vectors.json) precisam
        # ser regerados (tools/export_parity.gd) e commitados.
        run: |
          timeout 300 godot --headless --path . --script res://tools/export_parity.gd
          git diff --exit-code --stat server/test/vectors.json

      - name: Testes de interface
        run: |
          set -o pipefail
          # ~3 min local (macaco, voos e fades em tempo real); folga pro runner
          timeout 600 godot --headless --path . res://tests/UiTests.tscn 2>&1 | tee ui.log
          ! grep -q "SCRIPT ERROR" ui.log

      - name: Exportar Web
        run: |
          mkdir -p build/web
          timeout 600 godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          # imagem do cartão de compartilhamento (og:image), fora do pacote do jogo
          cp assets/web/og.jpg build/web/og.jpg
          grep -q "og:image" build/web/index.html

      - name: Exportar Windows
        run: |
          mkdir -p build/windows
          timeout 600 godot --headless --path . --export-release "Windows Desktop" build/windows/OndeEstaFlavio.exe
          test -f build/windows/OndeEstaFlavio.exe

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OndeEstaFlavio-windows
          path: build/windows/OndeEstaFlavio.exe

  deploy:
    # o ambiente github-pages só aceita deploy da main por padrão
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OndeEstaFlavio-windows
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" OndeEstaFlavio.exe \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Versão Windows: baixe OndeEstaFlavio.exe e abra. Para jogar no navegador: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
